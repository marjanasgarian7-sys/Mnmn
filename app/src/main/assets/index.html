<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ماشین حساب حرفه‌ای</title>

<style>

/* =========================
   تنظیمات پایه
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {

    --bg1: #667eea;
    --bg2: #764ba2;

    --panel: rgba(255,255,255,.18);
    --display: rgba(0,0,0,.25);

    --text: #ffffff;
    --muted: rgba(255,255,255,.7);

    --number1: #3949ab;
    --number2: #5c6bc0;

    --operator1: #ff7043;
    --operator2: #ff4081;

    --special1: #009688;
    --special2: #00bcd4;

    --equal1: #7b1fa2;
    --equal2: #e040fb;
}

/* =========================
   تم تاریک
========================= */

body.dark {

    --bg1: #080824;
    --bg2: #260044;

    --panel: rgba(20,20,35,.72);
    --display: rgba(0,0,0,.45);

    --text: #ffffff;
    --muted: rgba(255,255,255,.65);

    --number1: #252a68;
    --number2: #4149a0;

    --operator1: #c43f28;
    --operator2: #b52d67;

    --special1: #00695c;
    --special2: #00838f;

    --equal1: #5b1479;
    --equal2: #a92bc5;
}

/* =========================
   تم آبی
========================= */

body.theme-blue {

    --bg1: #2196f3;
    --bg2: #00bcd4;

    --panel: rgba(255,255,255,.20);
    --display: rgba(0,40,80,.25);

    --number1: #1565c0;
    --number2: #42a5f5;

    --operator1: #0277bd;
    --operator2: #00acc1;

    --special1: #00897b;
    --special2: #26c6da;

    --equal1: #3949ab;
    --equal2: #7e57c2;
}

/* =========================
   تم سبز
========================= */

body.theme-green {

    --bg1: #11998e;
    --bg2: #38ef7d;

    --panel: rgba(255,255,255,.20);
    --display: rgba(0,50,30,.25);

    --number1: #087f5b;
    --number2: #20c997;

    --operator1: #d9480f;
    --operator2: #f76707;

    --special1: #00897b;
    --special2: #00bfa5;

    --equal1: #5f3dc4;
    --equal2: #845ef7;
}

/* =========================
   تم صورتی
========================= */

body.theme-pink {

    --bg1: #ec407a;
    --bg2: #ab47bc;

    --panel: rgba(255,255,255,.20);
    --display: rgba(70,0,50,.25);

    --number1: #8e24aa;
    --number2: #ba68c8;

    --operator1: #d81b60;
    --operator2: #ff4081;

    --special1: #00897b;
    --special2: #26a69a;

    --equal1: #6a1b9a;
    --equal2: #e040fb;
}

/* =========================
   بدنه
========================= */

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            var(--bg1),
            var(--bg2)
        );

    display: flex;

    justify-content: center;

    align-items: center;

    transition:
        background .4s ease;

    overflow: hidden;
}

/* =========================
   ماشین حساب
========================= */

.calculator {

    width: min(94vw,430px);

    max-height: 96vh;

    padding: 18px;

    border-radius: 30px;

    background:
        var(--panel);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.3);

    overflow-y: auto;
}

/* =========================
   سربرگ
========================= */

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;
}

.title {

    color: var(--text);

    font-size: 24px;

    font-weight: bold;
}

.theme {

    width: 48px;

    height: 48px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,.22);

    color: white;

    font-size: 23px;

    cursor: pointer;
}

/* =========================
   منوی اصلی
========================= */

.menu {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 8px;

    margin-bottom: 15px;
}

.menu-btn {

    min-height: 44px;

    border: 0;

    border-radius: 16px;

    background:
        rgba(255,255,255,.20);

    color: white;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .1s;
}

.menu-btn:active {

    transform:
        scale(.95);
}

/* =========================
   نمایشگر
========================= */

.display {

    height: 145px;

    padding: 18px;

    margin-bottom: 16px;

    border-radius: 24px;

    background:
        var(--display);

    color: var(--text);

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    overflow: hidden;
}

.expression {

    min-height: 30px;

    color: var(--muted);

    font-size: 19px;

    direction: ltr;

    text-align: right;

    white-space: nowrap;

    overflow: hidden;
}

.result {

    margin-top: 5px;

    font-size: 44px;

    font-weight: bold;

    direction: ltr;

    text-align: right;

    white-space: nowrap;

    overflow-x: auto;
}

/* =========================
   دکمه‌های ماشین حساب
========================= */

.buttons {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 11px;
}

.calc {

    height: 69px;

    border: 0;

    border-radius: 21px;

    color: white;

    font-size: 25px;

    font-weight: bold;

    box-shadow:
        0 6px 12px
        rgba(0,0,0,.2);

    transition:
        transform .08s,
        filter .15s;

    cursor: pointer;
}

.calc:active {

    transform:
        scale(.91);

    filter:
        brightness(1.25);
}

.number {

    background:
        linear-gradient(
            145deg,
            var(--number1),
            var(--number2)
        );
}

.operator {

    background:
        linear-gradient(
            145deg,
            var(--operator1),
            var(--operator2)
        );
}

.special {

    background:
        linear-gradient(
            145deg,
            var(--special1),
            var(--special2)
        );
}

.equal {

    background:
        linear-gradient(
            145deg,
            var(--equal1),
            var(--equal2)
        );
}

.zero {

    grid-column:
        span 2;
}

/* =========================
   پنل کناری
========================= */

.drawer-bg {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.45);

    opacity: 0;

    visibility: hidden;

    transition: .3s;

    z-index: 50;
}

.drawer-bg.show {

    opacity: 1;

    visibility: visible;
}

.drawer {

    position: fixed;

    top: 0;

    right: 0;

    width:
        min(360px,90vw);

    height: 100vh;

    padding: 20px;

    background:
        rgba(30,30,50,.97);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:
        -15px 0 40px
        rgba(0,0,0,.45);

    transform:
        translateX(110%);

    transition:
        transform .35s ease;

    z-index: 100;

    overflow-y: auto;
}

.drawer.open {

    transform:
        translateX(0);
}

.drawer-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}

.drawer-title {

    color: white;

    font-size: 22px;

    font-weight: bold;
}

.close-btn {

    width: 42px;

    height: 42px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,.18);

    color: white;

    font-size: 26px;

    cursor: pointer;
}

/* =========================
   ابزار مهندسی
========================= */

.engineering-grid {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 10px;
}

.eng-btn {

    height: 58px;

    border: 0;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            #455a64,
            #78909c
        );

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.eng-btn:active {

    transform:
        scale(.94);
}

/* =========================
   مبدل
========================= */

.converter {

    color: white;
}

.categories {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 9px;

    margin-bottom: 18px;
}

.category {

    height: 45px;

    border: 0;

    border-radius: 14px;

    background:
        rgba(255,255,255,.13);

    color: white;

    font-size: 14px;

    cursor: pointer;
}

.category.active {

    background:
        linear-gradient(
            145deg,
            #009688,
            #00bcd4
        );
}

.converter label {

    display: block;

    color:
        rgba(255,255,255,.75);

    font-size: 14px;

    margin-bottom: 6px;
}

.converter input,
.converter select {

    width: 100%;

    height: 50px;

    border: 0;

    border-radius: 14px;

    margin-bottom: 12px;

    padding: 0 12px;

    font-size: 16px;

    outline: none;
}

.converter input {

    direction: ltr;

    text-align: left;
}

.converter select {

    color: #222;

    background: white;
}

.arrow {

    text-align: center;

    font-size: 25px;

    color: white;

    margin: -4px 0 7px;
}

.convert-result {

    min-height: 65px;

    padding: 15px;

    margin-top: 5px;

    border-radius: 17px;

    background:
        rgba(0,0,0,.3);

    color: white;

    direction: ltr;

    text-align: center;

    font-size: 20px;

    font-weight: bold;

    overflow-wrap: anywhere;
}

.info {

    margin-top: 15px;

    padding: 12px;

    border-radius: 14px;

    background:
        rgba(255,255,255,.08);

    color:
        rgba(255,255,255,.7);

    font-size: 12px;

    line-height: 1.8;
}

/* =========================
   پنل انتخاب تم
========================= */

.theme-panel {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 10px;

    margin-top: 15px;
}

.theme-option {

    height: 50px;

    border: 0;

    border-radius: 15px;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.theme-purple {

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );
}

.theme-blue {

    background:
        linear-gradient(
            135deg,
            #2196f3,
            #00bcd4
        );
}

.theme-green {

    background:
        linear-gradient(
            135deg,
            #11998e,
            #38ef7d
        );
}

.theme-pink {

    background:
        linear-gradient(
            135deg,
            #ec407a,
            #ab47bc
        );
}

/* =========================
   تخته حساب و کتاب
========================= */

.board-page {

    position: fixed;

    inset: 0;

    background: #ffffff;

    z-index: 500;

    display: none;

    flex-direction: column;
}

.board-page.show {

    display: flex;
}

.board-header {

    height: 65px;

    padding:
        8px 12px;

    background: #f5f5f5;

    border-bottom:
        1px solid #ddd;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 8px;
}

.board-title {

    color: #222;

    font-size: 20px;

    font-weight: bold;
}

.board-tools {

    display: flex;

    align-items: center;

    gap: 6px;

    flex-wrap: wrap;
}

.board-btn {

    min-width: 42px;

    height: 42px;

    border: 0;

    border-radius: 12px;

    background: #eeeeee;

    color: #222;

    font-size: 18px;

    cursor: pointer;
}

.board-btn.active {

    background: #333;

    color: white;
}

.board-back {

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    color: white;

    padding:
        0 15px;

    font-size: 14px;

    font-weight: bold;
}

.color-btn {

    width: 30px;

    min-width: 30px;

    height: 30px;

    border-radius: 50%;

    border: 3px solid white;

    box-shadow:
        0 0 0 1px #aaa;

    cursor: pointer;
}

.color-black {
    background: #000;
}

.color-red {
    background: #f44336;
}

.color-blue {
    background: #2196f3;
}

.color-green {
    background: #4caf50;
}

.color-purple {
    background: #9c27b0;
}

#drawingCanvas {

    flex: 1;

    width: 100%;

    background: white;

    touch-action: none;

    cursor: crosshair;
}

/* =========================
   موبایل
========================= */

@media(max-width:360px) {

    .calculator {

        padding: 14px;
    }

    .calc {

        height: 61px;

        font-size: 22px;
    }

    .display {

        height: 125px;
    }

    .result {

        font-size: 36px;
    }

    .drawer {

        width: 92vw;
    }

    .menu-btn {

        font-size: 12px;
    }

    .board-title {

        font-size: 16px;
    }

    .board-btn {

        min-width: 36px;

        height: 36px;
    }
}

</style>

</head>

<body>
<!-- ================================
     پس‌زمینه پنل‌ها
================================ -->

<div
    class="drawer-bg"
    id="drawerBg">
</div>


<!-- ================================
     پنل ابزارهای مهندسی
================================ -->

<div
    class="drawer"
    id="engineeringDrawer">

    <div class="drawer-header">

        <div class="drawer-title">
            ⚙️ ابزارهای مهندسی
        </div>

        <button
            class="close-btn"
            onclick="closeDrawer()">
            ×
        </button>

    </div>


    <div class="engineering-grid">

        <button
            class="eng-btn"
            onclick="engineering('sqrt')">
            √x
        </button>

        <button
            class="eng-btn"
            onclick="engineering('square')">
            x²
        </button>

        <button
            class="eng-btn"
            onclick="engineering('cube')">
            x³
        </button>

        <button
            class="eng-btn"
            onclick="engineering('inverse')">
            1/x
        </button>

        <button
            class="eng-btn"
            onclick="engineering('sin')">
            sin
        </button>

        <button
            class="eng-btn"
            onclick="engineering('cos')">
            cos
        </button>

        <button
            class="eng-btn"
            onclick="engineering('tan')">
            tan
        </button>

        <button
            class="eng-btn"
            onclick="engineering('asin')">
            sin⁻¹
        </button>

        <button
            class="eng-btn"
            onclick="engineering('acos')">
            cos⁻¹
        </button>

        <button
            class="eng-btn"
            onclick="engineering('atan')">
            tan⁻¹
        </button>

        <button
            class="eng-btn"
            onclick="engineering('log')">
            log
        </button>

        <button
            class="eng-btn"
            onclick="engineering('ln')">
            ln
        </button>

        <button
            class="eng-btn"
            onclick="engineering('factorial')">
            n!
        </button>

        <button
            class="eng-btn"
            onclick="engineering('pi')">
            π
        </button>

        <button
            class="eng-btn"
            onclick="engineering('e')">
            e
        </button>

    </div>

</div>


<!-- ================================
     پنل مبدل
================================ -->

<div
    class="drawer"
    id="converterDrawer">

    <div class="drawer-header">

        <div class="drawer-title">
            🔄 مبدل
        </div>

        <button
            class="close-btn"
            onclick="closeDrawer()">
            ×
        </button>

    </div>


    <div class="converter">


        <!-- دسته‌بندی‌ها -->

        <div class="categories">

            <button
                class="category active"
                onclick="setCategory('length',this)">
                📏 طول
            </button>

            <button
                class="category"
                onclick="setCategory('weight',this)">
                ⚖️ وزن
            </button>

            <button
                class="category"
                onclick="setCategory('temperature',this)">
                🌡️ دما
            </button>

            <button
                class="category"
                onclick="setCategory('area',this)">
                📐 مساحت
            </button>

            <button
                class="category"
                onclick="setCategory('volume',this)">
                🧊 حجم
            </button>

            <button
                class="category"
                onclick="setCategory('speed',this)">
                🚗 سرعت
            </button>

            <button
                class="category"
                onclick="setCategory('time',this)">
                ⏱️ زمان
            </button>

            <button
                class="category"
                onclick="setCategory('data',this)">
                💾 داده
            </button>

        </div>


        <label>
            مقدار
        </label>

        <input
            id="convertInput"
            type="number"
            value="1"
            step="any"
            oninput="convert()">


        <label>
            از
        </label>

        <select
            id="fromUnit"
            onchange="convert()">
        </select>


        <div class="arrow">
            ↓
        </div>


        <label>
            به
        </label>

        <select
            id="toUnit"
            onchange="convert()">
        </select>


        <div
            class="convert-result"
            id="convertResult">
            1
        </div>


        <div class="info">

            تبدیل‌ها کاملاً آفلاین انجام می‌شوند.

            <br>

            می‌توانید دسته‌بندی مورد نظر
            خود را انتخاب کنید.

        </div>

    </div>

</div>


<!-- ================================
     پنل انتخاب تم
================================ -->

<div
    class="drawer"
    id="themeDrawer">

    <div class="drawer-header">

        <div class="drawer-title">
            🎨 انتخاب ظاهر
        </div>

        <button
            class="close-btn"
            onclick="closeDrawer()">
            ×
        </button>

    </div>


    <div class="info">

        یکی از تم‌های زیر را انتخاب کنید.

        <br>

        هر تم دارای حالت روشن و تاریک است.

    </div>


    <div class="theme-panel">

        <button
            class="theme-option theme-purple"
            onclick="setTheme('purple')">
            💜 بنفش
        </button>

        <button
            class="theme-option theme-blue"
            onclick="setTheme('blue')">
            💙 آبی
        </button>

        <button
            class="theme-option theme-green"
            onclick="setTheme('green')">
            💚 سبز
        </button>

        <button
            class="theme-option theme-pink"
            onclick="setTheme('pink')">
            💗 صورتی
        </button>

    </div>

</div>


<!-- ================================
     صفحه تخته حساب و کتاب
================================ -->

<div
    class="board-page"
    id="boardPage">


    <!-- سربرگ تخته -->

    <div class="board-header">

        <div class="board-title">
            📝 تخته حساب و کتاب
        </div>


        <div class="board-tools">


            <!-- رنگ‌ها -->

            <button
                class="color-btn color-black"
                title="مشکی"
                onclick="setPenColor('#000000')">
            </button>

            <button
                class="color-btn color-red"
                title="قرمز"
                onclick="setPenColor('#f44336')">
            </button>

            <button
                class="color-btn color-blue"
                title="آبی"
                onclick="setPenColor('#2196f3')">
            </button>

            <button
                class="color-btn color-green"
                title="سبز"
                onclick="setPenColor('#4caf50')">
            </button>

            <button
                class="color-btn color-purple"
                title="بنفش"
                onclick="setPenColor('#9c27b0')">
            </button>


            <!-- قلم -->

            <button
                class="board-btn active"
                id="penButton"
                title="قلم"
                onclick="setTool('pen')">
                🖊️
            </button>


            <!-- پاک‌کن -->

            <button
                class="board-btn"
                id="eraserButton"
                title="پاک‌کن"
                onclick="setTool('eraser')">
                🧽
            </button>


            <!-- پاک کردن کل تخته -->

            <button
                class="board-btn"
                title="پاک کردن تخته"
                onclick="clearBoard()">
                🗑️
            </button>


            <!-- بازگشت -->

            <button
                class="board-btn board-back"
                onclick="closeBoard()">
                ↩️ بازگشت
            </button>

        </div>

    </div>


    <!-- بوم نقاشی -->

    <canvas
        id="drawingCanvas">
    </canvas>

</div>


<!-- ================================
     ماشین حساب اصلی
================================ -->

<div class="calculator">


    <!-- سربرگ -->

    <div class="header">

        <div class="title">
            ماشین حساب
        </div>


        <button
            class="theme"
            id="themeButton"
            onclick="toggleTheme()">
            🌙
        </button>

    </div>


    <!-- منوی اصلی -->

    <div class="menu">

        <button
            class="menu-btn"
            onclick="openEngineering()">
            ⚙️ مهندسی
        </button>


        <button
            class="menu-btn"
            onclick="openConverter()">
            🔄 مبدل
        </button>


        <button
            class="menu-btn"
            onclick="openThemes()">
            🎨 تم‌ها
        </button>

    </div>


    <!-- نمایشگر -->

    <div class="display">

        <div
            class="expression"
            id="expression">
        </div>


        <div
            class="result"
            id="result">
            0
        </div>

    </div>


    <!-- دکمه‌های ماشین حساب -->

<script>

/* ================================
   متغیرهای ماشین حساب
================================ */

let current = "0";

let previous = null;

let operator = null;

let resetScreen = false;


/* گرفتن عناصر صفحه */

const result =
    document.getElementById("result");

const expression =
    document.getElementById("expression");


/* ================================
   بروزرسانی نمایشگر
================================ */

function updateDisplay() {

    result.textContent = current;

}


/* ================================
   وارد کردن عدد
================================ */

function number(value) {

    if (
        current === "خطا" ||
        resetScreen
    ) {

        current = value;

        resetScreen = false;

    }

    else if (
        current === "0"
    ) {

        current = value;

    }

    else {

        current += value;

    }

    updateDisplay();

}


/* ================================
   اعشار
================================ */

function decimal() {

    if (
        current === "خطا" ||
        resetScreen
    ) {

        current = "0.";

        resetScreen = false;

    }

    else if (
        !current.includes(".")
    ) {

        current += ".";

    }

    updateDisplay();

}


/* ================================
   انتخاب عملگر
================================ */

function chooseOperator(op) {

    if (current === "خطا") {

        clearAll();

        return;

    }


    if (
        operator !== null &&
        !resetScreen
    ) {

        calculate();

    }


    previous =
        parseFloat(current);

    operator = op;

    resetScreen = true;


    expression.textContent =
        formatNumber(previous)
        + " "
        + op;

}


/* ================================
   محاسبه
================================ */

function calculate() {

    if (
        operator === null ||
        previous === null
    ) {

        return;

    }


    const currentNumber =
        parseFloat(current);


    let answer;


    switch (operator) {

        case "+":

            answer =
                previous +
                currentNumber;

            break;


        case "−":

            answer =
                previous -
                currentNumber;

            break;


        case "×":

            answer =
                previous *
                currentNumber;

            break;


        case "÷":

            if (
                currentNumber === 0
            ) {

                current = "خطا";

                expression.textContent =
                    "تقسیم بر صفر";

                operator = null;

                previous = null;

                updateDisplay();

                return;

            }


            answer =
                previous /
                currentNumber;

            break;

    }


    expression.textContent =
        formatNumber(previous)
        + " "
        + operator
        + " "
        + formatNumber(currentNumber)
        + " =";


    current =
        formatNumber(answer);


    previous = null;

    operator = null;

    resetScreen = true;


    updateDisplay();

}


/* ================================
   پاک کردن کامل
================================ */

function clearAll() {

    current = "0";

    previous = null;

    operator = null;

    resetScreen = false;

    expression.textContent = "";

    updateDisplay();

}


/* ================================
   پاک کردن یک رقم
================================ */

function backspace() {

    if (
        current === "خطا"
    ) {

        clearAll();

        return;

    }


    if (
        current.length <= 1
    ) {

        current = "0";

    }

    else {

        current =
            current.slice(
                0,
                -1
            );

    }


    updateDisplay();

}


/* ================================
   درصد
================================ */

function percent() {

    const value =
        parseFloat(current);


    if (
        isNaN(value)
    ) {

        return;

    }


    current =
        formatNumber(
            value / 100
        );


    updateDisplay();

}


/* ================================
   فرمت عدد
================================ */

function formatNumber(value) {

    if (
        !Number.isFinite(value)
    ) {

        return "خطا";

    }


    return String(
        Number(
            value.toFixed(10)
        )
    );

}

/* ================================

function engineering(type) {

    const value =
        parseFloat(current);


    let answer;


    /* =========================
       عدد پی
    ========================= */

    if (type === "pi") {

        current =
            formatNumber(Math.PI);

        expression.textContent =
            "π";

        resetScreen = true;

        updateDisplay();

        closeDrawer();

        return;

    }


    /* =========================
       عدد اویلر
    ========================= */

    if (type === "e") {

        current =
            formatNumber(Math.E);

        expression.textContent =
            "e";

        resetScreen = true;

        updateDisplay();

        closeDrawer();

        return;

    }


    /* بررسی عدد */

    if (
        isNaN(value)
    ) {

        current = "خطا";

        expression.textContent =
            "ورودی نامعتبر";

        updateDisplay();

        return;

    }


    /* =========================
       عملیات
    ========================= */

    switch (type) {


        /* جذر */

        case "sqrt":

            if (value < 0) {

                current = "خطا";

                expression.textContent =
                    "جذر عدد منفی";

                updateDisplay();

                return;

            }


            answer =
                Math.sqrt(value);


            expression.textContent =
                "√" + value;

            break;


        /* توان دو */

        case "square":

            answer =
                value * value;


            expression.textContent =
                value + "²";

            break;


        /* توان سه */

        case "cube":

            answer =
                value *
                value *
                value;


            expression.textContent =
                value + "³";

            break;


        /* معکوس */

        case "inverse":

            if (value === 0) {

                current = "خطا";

                expression.textContent =
                    "تقسیم بر صفر";

                updateDisplay();

                return;

            }


            answer =
                1 / value;


            expression.textContent =
                "1/" + value;

            break;


        /* سینوس */

        case "sin":

            answer =
                Math.sin(
                    value *
                    Math.PI /
                    180
                );


            expression.textContent =
                "sin(" +
                value +
                "°)";

            break;


        /* کسینوس */

        case "cos":

            answer =
                Math.cos(
                    value *
                    Math.PI /
                    180
                );


            expression.textContent =
                "cos(" +
                value +
                "°)";

            break;


        /* تانژانت */

        case "tan":

            answer =
                Math.tan(
                    value *
                    Math.PI /
                    180
                );


            expression.textContent =
                "tan(" +
                value +
                "°)";

            break;


        /* سینوس معکوس */

        case "asin":

            if (
                value < -1 ||
                value > 1
            ) {

                current = "خطا";

                expression.textContent =
                    "دامنه نامعتبر";

                updateDisplay();

                return;

            }


            answer =
                Math.asin(value) *
                180 /
                Math.PI;


            expression.textContent =
                "sin⁻¹(" +
                value +
                ")";

            break;


        /* کسینوس معکوس */

        case "acos":

            if (
                value < -1 ||
                value > 1
            ) {

                current = "خطا";

                expression.textContent =
                    "دامنه نامعتبر";

                updateDisplay();

                return;

            }


            answer =
                Math.acos(value) *
                180 /
                Math.PI;


            expression.textContent =
                "cos⁻¹(" +
                value +
                ")";

            break;


        /* تانژانت معکوس */

        case "atan":

            answer =
                Math.atan(value) *
                180 /
                Math.PI;


            expression.textContent =
                "tan⁻¹(" +
                value +
                ")";

            break;


        /* لگاریتم پایه ۱۰ */

        case "log":

            if (value <= 0) {

                current = "خطا";

                expression.textContent =
                    "log نامعتبر";

                updateDisplay();

                return;

            }


            answer =
                Math.log10(value);


            expression.textContent =
                "log(" +
                value +
                ")";

            break;


        /* لگاریتم طبیعی */

        case "ln":

            if (value <= 0) {

                current = "خطا";

                expression.textContent =
                    "ln نامعتبر";

                updateDisplay();

                return;

            }


            answer =
                Math.log(value);


            expression.textContent =
                "ln(" +
                value +
                ")";

            break;


        /* فاکتوریل */

        case "factorial":

            if (
                value < 0 ||
                !Number.isInteger(value) ||
                value > 170
            ) {

                current = "خطا";

                expression.textContent =
                    "فاکتوریل نامعتبر";

                updateDisplay();

                return;

            }


            answer = factorial(value);


            expression.textContent =
                value + "!";

            break;

    }


    current =
        formatNumber(answer);


    resetScreen = true;


    updateDisplay();


    closeDrawer();

}


/* ================================
   فاکتوریل
================================ */

function factorial(n) {

    if (n === 0 || n === 1) {

        return 1;

    }


    let result = 1;


    for (
        let i = 2;
        i <= n;
        i++
    ) {

        result *= i;

    }


    return result;

}

let currentCategory = "length";


function setCategory(category, button) {

    currentCategory = category;

    document
        .querySelectorAll(".category")

    Object.keys(units).forEach(

            option1.value = unit;

                document.createElement(

                );

            option2.textContent = unit;


            from.appendChild(
                option1
            );

            to.appendChild(
                option2
            );

        }
    );


    /* انتخاب پیش‌فرض */

    if (
        to.options.length > 1
    ) {

        to.selectedIndex = 1;

    }

/* ================================
   تبدیل دما
================================ */

function convertTemperature(
    value,
    from,
    to
) {

    let celsius;


    /* ابتدا به سلسیوس */

    if (from === "سلسیوس") {

        celsius = value;

    }

    else if (from === "فارنهایت") {

        celsius =
            (value - 32) *
            5 / 9;

    }

    else if (from === "کلوین") {

        celsius =
            value - 273.15;

    }


    /* سپس از سلسیوس */

    if (to === "سلسیوس") {

        return celsius;

    }


    if (to === "فارنهایت") {

        return (
            celsius *
            9 / 5
        ) + 32;

    }


    if (to === "کلوین") {

        return (
            celsius +
            273.15
        );

    }

}

    if (

    ) {

        output.textContent =
            "لطفاً یک مقدار وارد کنید";

        return;

    }


    let answer;


    /* =========================
       تبدیل دما
    ========================= */

    if (
        currentCategory ===
        "temperature"
    ) {

        answer =
            convertTemperature(
                value,
                from.value,
                to.value
            );

    }


    /* =========================
       تبدیل سایر واحدها
    ========================= */

    else {

        const units =
            converterUnits[
                currentCategory
            ];


        const baseValue =
            value *
            units[from.value];


        answer =
            baseValue /
            units[to.value];

    }


    output.textContent =
        formatNumber(answer) +
        " " +
        to.value;

}

/* ================================
   اندازه بوم
================================ */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const oldCanvas =
        document.createElement(
            "canvas"
        );


    oldCanvas.width =
        canvas.width;

    oldCanvas.height =
        canvas.height;


    const oldCtx =
        oldCanvas.getContext(
            "2d"
        );


    if (
        canvas.width > 0 &&
        canvas.height > 0
    ) {

        oldCtx.drawImage(
            canvas,
            0,
            0
        );

    }


    canvas.width =
        rect.width *
        window.devicePixelRatio;


    canvas.height =
        rect.height *
        window.devicePixelRatio;


    canvas.style.width =
        rect.width + "px";


    canvas.style.height =
        rect.height + "px";


    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );


    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.lineWidth = 4;


    if (
        oldCanvas.width > 0 &&
        oldCanvas.height > 0
    ) {

        ctx.drawImage(
            oldCanvas,
            0,
            0,
            oldCanvas.width,
            oldCanvas.height,
            0,
            0,
            rect.width,
            rect.height
        );

    }

}

    ) {

        clientX =
            event.touches[0].clientX;

        clientY =
            event.touches[0].clientY;

    }

    else {

        clientX =
            event.clientX;

        clientY =
            event.clientY;

    }


    return {

        x:
            clientX -
            rect.left,

        y:
            clientY -
            rect.top

    };

}


/* ================================
   شروع طراحی
================================ */

function startDrawing(event) {

    event.preventDefault();


    drawing = true;


    const position =
        getPosition(event);


    lastX =
        position.x;

    lastY =
        position.y;


    ctx.beginPath();

    ctx.moveTo(
        lastX,
        lastY
    );


    ctx.lineTo(
        lastX + 0.1,
        lastY + 0.1
    );


    ctx.strokeStyle =
        tool === "eraser"
            ? "#ffffff"
            : penColor;


    ctx.lineWidth =
        tool === "eraser"
            ? 25
            : 4;


    ctx.stroke();

}


/* ================================
   ادامه طراحی
================================ */

function draw(event) {

    if (!drawing) {

        return;

    }


    event.preventDefault();


    const position =
        getPosition(event);


    const x =
        position.x;

    const y =
        position.y;


    ctx.beginPath();


    ctx.moveTo(
        lastX,
        lastY
    );


    ctx.lineTo(
        x,
        y
    );


    ctx.strokeStyle =
        tool === "eraser"
            ? "#ffffff"
            : penColor;


    ctx.lineWidth =
        tool === "eraser"
            ? 25
            : 4;


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";


    ctx.stroke();


    lastX = x;

    lastY = y;

}


/* ================================
   پایان طراحی
================================ */

function stopDrawing() {

    drawing = false;

    ctx.beginPath();

}


/* ================================
   رویدادهای موس
================================ */

canvas.addEventListener(
    "mousedown",
    startDrawing
);


canvas.addEventListener(
    "mousemove",
    draw
);


canvas.addEventListener(
    "mouseup",
    stopDrawing
);


canvas.addEventListener(
    "mouseleave",
    stopDrawing
);


/* ================================
   رویدادهای لمسی موبایل
================================ */

canvas.addEventListener(
    "touchstart",
    startDrawing,
    { passive: false }
);


canvas.addEventListener(
    "touchmove",
    draw,
    { passive: false }
);


canvas.addEventListener(
    "touchend",
    stopDrawing
);


/* ================================
   تغییر اندازه صفحه
================================ */

window.addEventListener(
    "resize",
    function() {

        if (
            boardPage.classList.contains(
                "show"
            )
        ) {

            resizeCanvas();

        }

    }
);


/* ================================
   پاک کردن کل تخته
================================ */

function clearBoard() {

    const confirmed =
        confirm(
            "آیا می‌خواهید کل تخته پاک شود؟"
        );


    if (!confirmed) {

        return;

    }


    const rect =
        canvas.getBoundingClientRect();


    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    /* چون زمینه سفید است */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        rect.width,
        rect.height
    );

}


/* ================================
   پایان قسمت ۴
================================ */
/* ================================
   اتصال دکمه تخته حساب و کتاب
================================ */

/*
   دکمه تخته را به منوی اصلی
   اضافه می‌کنیم.
*/

const menu =
    document.querySelector(".menu");


const boardButton =
    document.createElement("button");


boardButton.className =
    "menu-btn";


boardButton.innerHTML =
    "📝 تخته حساب و کتاب";


boardButton.onclick =
    function() {

        closeDrawer();

        openBoard();

    };


/*
   اضافه کردن دکمه به منو
*/

menu.appendChild(
    boardButton
);


/* ================================
   کلیدهای صفحه‌کلید
================================ */

document.addEventListener(
    "keydown",
    function(event) {

        /*
           اگر تخته باز است،
           کلیدهای ماشین حساب
           کاری انجام ندهند.
        */

        if (
            boardPage.classList.contains(
                "show"
            )
        ) {

            /*
               Escape = بازگشت
            */

            if (
                event.key === "Escape"
            ) {

                closeBoard();

            }

            return;

        }


        /*
           اعداد
        */

        if (
            event.key >= "0" &&
            event.key <= "9"
        ) {

            number(
                event.key
            );

        }


        /*
           اعشار
        */

        else if (
            event.key === "."
        ) {

            decimal();

        }


        /*
           جمع
        */

        else if (
            event.key === "+"
        ) {

            chooseOperator("+");

        }


        /*
           تفریق
        */

        else if (
            event.key === "-"
        ) {

            chooseOperator("−");

        }


        /*
           ضرب
        */

        else if (
            event.key === "*" ||
            event.key === "x" ||
            event.key === "X"
        ) {

            chooseOperator("×");

        }


        /*
           تقسیم
        */

        else if (
            event.key === "/"
        ) {

            chooseOperator("÷");

        }


        /*
           مساوی
        */

        else if (
            event.key === "=" ||
            event.key === "Enter"
        ) {

            calculate();

        }


        /*
           Backspace
        */

        else if (
            event.key === "Backspace"
        ) {

            backspace();

        }


        /*
           Escape = پاک کردن
        */

        else if (
            event.key === "Escape"
        ) {

            clearAll();

        }

    }
);


/* ================================
   ذخیره تنظیمات تم
================================ */

function saveTheme() {

    let theme = "purple";


    if (
        document.body.classList.contains(
            "theme-blue"
        )
    ) {

        theme = "blue";

    }

    else if (
        document.body.classList.contains(
            "theme-green"
        )
    ) {

        theme = "green";

    }

    else if (
        document.body.classList.contains(
            "theme-pink"
        )
    ) {

        theme = "pink";

    }


    localStorage.setItem(
        "calculatorTheme",
        theme
    );


    localStorage.setItem(
        "calculatorDark",
        document.body.classList.contains(
            "dark"
        )
    );

}


/* ================================
   بارگذاری تنظیمات
================================ */

function loadTheme() {

    const savedTheme =
        localStorage.getItem(
            "calculatorTheme"
        );


    const savedDark =
        localStorage.getItem(
            "calculatorDark"
        );


    if (
        savedTheme &&
        savedTheme !== "purple"
    ) {

        setTheme(
            savedTheme
        );

    }


    if (
        savedDark === "true"
    ) {

        document.body.classList.add(
            "dark"
        );


        document.getElementById(
            "themeButton"
        ).textContent = "☀️";

    }

}


/* ================================
   اصلاح ذخیره تم
================================ */

const oldSetTheme =
    setTheme;


setTheme = function(theme) {

    oldSetTheme(theme);

    saveTheme();

};


const oldToggleTheme =
    toggleTheme;


toggleTheme = function() {

    oldToggleTheme();

    saveTheme();

};


/* ================================
   مقداردهی اولیه
================================ */

loadTheme();


/* ================================
   جلوگیری از اسکرول صفحه هنگام
   کار با تخته در موبایل
================================ */

document.addEventListener(
    "touchmove",
    function(event) {

        if (
            boardPage.classList.contains(
                "show"
            ) &&
            event.target === canvas
        ) {

            event.preventDefault();

        }

    },
    { passive: false }
);


/* ================================
   مقدار اولیه تخته
================================ */

function initializeBoard() {

    /*
       زمینه سفید اولیه
    */

    const rect =
        canvas.getBoundingClientRect();


    if (
        rect.width > 0 &&
        rect.height > 0
    ) {

        canvas.width =
            rect.width *
            window.devicePixelRatio;


        canvas.height =
            rect.height *
            window.devicePixelRatio;


        ctx.setTransform(
            window.devicePixelRatio,
            0,
            0,
            window.devicePixelRatio,
            0,
            0
        );


        ctx.fillStyle =
            "#ffffff";


        ctx.fillRect(
            0,
            0,
            rect.width,
            rect.height
        );

    }

}


/* ================================
   اجرای اولیه
================================ */

window.addEventListener(
    "load",
    function() {

        initializeBoard();

        updateDisplay();

    }
);


/* ================================
   پایان JavaScript
================================ */

</script>
